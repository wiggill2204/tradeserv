<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1B2C4F" />
<title>TradeServ — Quote on site</title>
<style>
  :root{
    /* AC Electrical palette: deep navy + bright sky-blue spark */
    --blue:#1B2C4F; --blue-dark:#12203b; --amber:#34B3E4; --amber-dark:#1f93c2;
    --bg:#eef2f8; --card:#ffffff; --ink:#1c2433; --muted:#6b7689; --line:#e1e7f1;
    --green:#1f9d57; --red:#d64545; --shadow:0 2px 10px rgba(20,40,90,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
    max-width:520px; margin:0 auto; min-height:100vh; position:relative;
  }
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--blue); color:#fff;
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
  }
  .topbar .back{font-size:22px; line-height:1; background:none;border:none;color:#fff;cursor:pointer;padding:2px 6px;border-radius:8px}
  .topbar h1{font-size:16px; margin:0; font-weight:650; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .topbar .logo{font-weight:800; letter-spacing:.3px}
  .topbar .logo b{color:var(--amber)}
  .tb-mic{display:flex;align-items:center;gap:6px;background:var(--amber);color:#06283b;border:none;border-radius:22px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
  .tb-mic:active{background:var(--amber-dark)}
  .tb-demo{font-size:10px;opacity:.7;font-weight:700;letter-spacing:.5px}
  .wrap{padding:16px 16px 96px}
  h2{font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:22px 2px 10px; font-weight:700}
  .card{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px}
  .card.tap{cursor:pointer; transition:transform .06s ease}
  .card.tap:active{transform:scale(.99)}
  label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 5px}
  input,textarea,select{
    width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; color:var(--ink); background:#fff;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--blue)}
  textarea{resize:vertical; min-height:90px; line-height:1.5}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:15px; border:none; border-radius:12px; font-size:16px; font-weight:700;
    cursor:pointer; margin-top:14px; font-family:inherit;
  }
  .btn.primary{background:var(--blue); color:#fff}
  .btn.primary:active{background:var(--blue-dark)}
  .btn.amber{background:var(--amber); color:#06283b}
  .btn.amber:active{background:var(--amber-dark)}
  .btn.ghost{background:#fff; color:var(--blue); border:1.5px solid var(--line)}
  .btn.green{background:var(--green); color:#fff}
  .btn.sm{padding:10px 14px; font-size:14px; width:auto; margin-top:0}
  .row{display:flex; gap:10px}
  .row > *{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .right{text-align:right}
  .empty{text-align:center; color:var(--muted); padding:34px 20px}
  .empty .ic{font-size:46px; margin-bottom:8px}
  .joblist .card{display:flex; align-items:center; gap:12px}
  .joblist .meta{flex:1; min-width:0}
  .joblist .meta .nm{font-weight:700}
  .joblist .meta .ad{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap}
  .badge.draft{background:#fff3da; color:#9a6a00}
  .badge.quoted{background:#e3f3ff; color:#0a5ca8}
  .badge.sent{background:#e1f6ea; color:#127a44}
  .fab{position:fixed; left:50%; transform:translateX(-50%); bottom:20px; width:min(488px,calc(100% - 32px)); z-index:15;}
  /* field with mic */
  .ip{position:relative}
  .ip input{padding-right:50px}
  .ip-mic{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:38px;height:38px;border-radius:9px;border:none;background:#eaf6fd;color:var(--amber-dark);font-size:18px;cursor:pointer}
  .ip-mic:active{background:#d3ecf8}
  .hintline{font-size:12.5px;color:var(--muted);margin:4px 2px 0;display:flex;align-items:center;gap:5px}
  /* sections */
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 2px}
  .chip{background:#eef2f8;border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}
  .chip:active{background:#dde6f3}
  .sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:11px;background:#fbfcfe}
  .sec-top{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .sec-title{flex:1;font-weight:700;font-size:16px;padding:9px 11px}
  .sec-mic{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--amber);color:#06283b;border:none;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .sec-mic:active{background:var(--amber-dark)}
  .sec-del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px}
  /* quote */
  .qsec-head{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
  .qsec-head .t{flex:1;font-weight:800;font-size:15px;color:var(--blue)}
  .qsec-head .m{background:#eaf6fd;color:var(--amber-dark);border:none;border-radius:9px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
  .qline{display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:1px solid var(--line)}
  .qline:last-child{border-bottom:none}
  .qline .d{flex:1; min-width:0}
  .qline .d .t{font-weight:600; font-size:15px}
  .qline .d .s{font-size:12px; color:var(--muted)}
  .qline .qty{width:52px}
  .qline .qty input{padding:7px; text-align:center; font-size:15px}
  .qline .amt{width:82px; text-align:right; font-weight:700; font-size:15px}
  .qline .del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 2px}
  .secsub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:8px 0 2px;font-weight:600}
  .totrow{display:flex; justify-content:space-between; padding:7px 0; font-size:15px}
  .totrow.big{font-size:21px; font-weight:800; border-top:2px solid var(--ink); margin-top:8px; padding-top:12px}
  .totrow .lbl{color:var(--muted)}
  .totrow .prof{color:var(--green);font-weight:700}
  .mkpct{width:48px;padding:4px 6px;font-size:13px;font-weight:700;text-align:center;color:var(--blue);border-color:var(--amber);border-width:1.5px;margin:0 2px;display:inline-block;height:auto}
  .doc-head{text-align:center; padding:6px 0 14px; border-bottom:2px solid var(--blue); margin-bottom:6px}
  .doc-head .co{font-size:20px;font-weight:800;color:var(--blue)}
  .doc-head .tag{font-size:12px;color:var(--amber-dark);font-style:italic;margin-top:2px}
  .doc-head .ti{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px}
  .docsec{font-weight:800;color:var(--blue);font-size:14px;margin:12px 0 2px}
  .kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  .note{background:#eaf6fd;border:1px solid #bfe6f8;border-radius:10px;padding:11px 13px;font-size:13px;color:#0c5a82;margin-bottom:12px}
  .send-preview{background:#f5f8ff;border:1px dashed var(--blue);border-radius:12px;padding:14px;font-size:14px;white-space:pre-wrap;color:var(--ink)}
  .successbox{text-align:center;padding:24px 10px}
  .successbox .ic{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  /* Price list table (Excel-style) */
  .ptbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
  .ptbl th{background:#eef2f8;color:var(--blue);font-weight:700;text-align:left;padding:8px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--blue);white-space:nowrap}
  .ptbl th.psortable{cursor:pointer;user-select:none}
  .ptbl th.psortable:after{content:" ↕";opacity:.35;font-size:9px}
  .ptbl th.psortable.sort-asc:after{content:" ▲";opacity:.95}
  .ptbl th.psortable.sort-desc:after{content:" ▼";opacity:.95}
  .ptbl th:nth-child(1){width:30px;padding:8px 2px;text-align:center}
  .ptbl th:nth-child(3){width:54px;text-align:center}
  .ptbl th:nth-child(4){width:84px}
  .ptbl th:nth-child(5){width:90px;text-align:right;padding-right:6px}
  .ptbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
  .ptbl tr.pchecked{background:#f0f8ff}
  .ptbl td:nth-child(1){text-align:center;padding:7px 2px}
  .ptbl input[type=checkbox]{width:auto;margin:0;cursor:pointer;transform:scale(1.1)}
  .ptbl td.pnm{font-weight:600;color:var(--ink);line-height:1.3;font-size:12.5px;word-break:break-word}
  .ptbl td.pupd{font-size:11px;color:var(--muted);white-space:nowrap;text-align:center}
  .ptbl td.psup input{font-size:11.5px;padding:4px 5px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:5px;font-weight:600;color:var(--blue);box-sizing:border-box;font-family:inherit;height:auto}
  .ptbl td.psup input::placeholder{color:var(--muted);font-weight:400;font-style:italic}
  .ptbl td.pcost input{font-size:12.5px;padding:5px 6px;text-align:right;width:100%;border:1px solid var(--line);border-radius:5px;font-weight:700;color:var(--ink);box-sizing:border-box;font-family:inherit;height:auto}
  .bulk-bar{background:#eaf6fd;padding:10px 12px;border-radius:10px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid #bfe6f8}
  .bulk-bar .bcount{font-weight:800;color:var(--blue);margin-right:auto;font-size:13px}
  .bulk-bar .btn{margin-top:0;padding:6px 10px;font-size:12px;width:auto;flex:0 0 auto;background:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .seg{display:flex;background:#e7ebf3;border-radius:10px;padding:3px;margin-top:10px}
  .seg button{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  /* voice overlay */
  #voice-ov{position:fixed;inset:0;background:rgba(12,22,44,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .ov-card{background:#fff;border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center}
  .ov-mic{width:80px;height:80px;border-radius:50%;background:var(--red);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pulse 1.3s infinite}
  .ov-title{font-weight:800;font-size:17px}
  .ov-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ov-live{min-height:64px;background:#f5f8ff;border-radius:12px;padding:13px;font-size:15px;margin:14px 0 4px;text-align:left;color:var(--ink)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.5)}70%{box-shadow:0 0 0 20px rgba(214,69,69,0)}100%{box-shadow:0 0 0 0 rgba(214,69,69,0)}}
  /* manual add-item sheet */
  #add-ov{position:fixed;inset:0;background:rgba(12,22,44,.55);display:none;align-items:flex-end;justify-content:center;z-index:55}
  .add-card{background:#fff;border-radius:18px 18px 0 0;padding:16px 14px 18px;max-width:520px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:10px}
  .add-head{display:flex;justify-content:space-between;align-items:center}
  .add-head b{font-size:17px;color:var(--blue);font-weight:800}
  .add-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 6px}
  .add-list{flex:1;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:2px -4px;padding:0 4px}
  .add-row{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line)}
  .add-row:last-child{border-bottom:none}
  .add-row .add-d{flex:1;min-width:0}
  .add-row .add-n{font-weight:600;font-size:14px}
  .add-row .add-p{font-size:12px;color:var(--muted)}
  .add-row .add-q{width:54px;padding:7px;text-align:center;font-size:14px}
  .add-row .add-go{width:40px;height:40px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-size:22px;font-weight:700;cursor:pointer;flex:0 0 auto}
  .add-row .add-go:active{background:var(--blue-dark)}
  .add-empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
  /* Manual-entry table on the Import tab */
  .entrytbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .entryhead{display:flex;background:#eef2f8;padding:7px 0;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .entryhead > div{padding:0 8px}
  .ec-d{flex:1.8;min-width:0;width:auto}
  .ec-s{flex:1.2;min-width:0;width:auto}
  .ec-p{flex:0 0 84px;width:84px;text-align:right}
  .ec-x{flex:0 0 34px;width:34px;text-align:center}
  .entryrow{display:flex;align-items:center;border-top:1px solid var(--line)}
  .entryrow input{border:none;background:transparent;padding:9px 8px;font-size:14px;border-radius:0;box-sizing:border-box}
  .entryrow input.ec-p{text-align:right}
  .entryrow input:focus{background:#f5f9ff;outline:1.5px solid var(--blue);outline-offset:-1px}
  .entryrow input::placeholder{color:#b0b7c2;font-style:italic}
  .entryrow .ec-x{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;padding:0}
  /* map pin-drop modal */
  #map-ov{position:fixed;inset:0;background:rgba(12,22,44,.7);display:none;align-items:stretch;justify-content:center;z-index:60}
  .map-card{background:#fff;width:100%;max-width:520px;height:100vh;display:flex;flex-direction:column}
  .map-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--blue);color:#fff}
  .map-head h3{flex:1;margin:0;font-size:16px;font-weight:700}
  .map-head .x{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px}
  .map-body{flex:1;position:relative}
  #leaflet-map{position:absolute;inset:0;background:#e7ebf3}
  .map-locate{position:absolute;top:10px;right:10px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .map-foot{padding:10px 12px;display:flex;gap:8px;align-items:center;background:#fff;border-top:1px solid var(--line)}
  .map-coords{flex:1;font-size:12.5px;color:var(--muted)}
  .map-foot .btn{margin-top:0;padding:11px 16px}
  /* staff / team / costing */
  .staffrow{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .staffrow input{padding:9px 10px;font-size:14px}
  .staffrow .nm{flex:1.6;min-width:0}
  .staffrow .rl{flex:1.1;min-width:0}
  .staffrow .rt{width:80px}
  .staffrow .rt input{text-align:right}
  .teamrow{display:flex;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
  .teamrow:last-child{border-bottom:none}
  .teamrow .nm{flex:1;min-width:0}
  .teamrow .nm .t{font-weight:700;font-size:14px}
  .teamrow .nm .s{font-size:12px;color:var(--muted)}
  .teamrow .hrs{width:60px}
  .teamrow .hrs input{padding:7px;text-align:center;font-size:14px}
  .teamrow .cost{width:84px;text-align:right;font-weight:700;font-size:13px;color:var(--blue)}
  .teamrow .del{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 2px}
  .teamtotal{display:flex;justify-content:space-between;margin-top:8px;font-weight:700;font-size:14px;color:var(--blue)}
  .costing{background:#f3f7fc;border:1px solid #c9d6ec;border-radius:12px;padding:13px 14px;margin-top:12px}
  .costing h3{font-size:11px;margin:0 0 6px;color:var(--blue);font-weight:800;letter-spacing:1px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .costing h3 .note{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px}
  .costing .crow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#4a566e}
  .costing .crow.profit{font-size:15px;font-weight:800;color:var(--green);border-top:1px solid #c9d6ec;margin-top:6px;padding-top:8px}
  .costing .crow.loss{color:var(--red)}
  .thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  /* professional quote document */
  .qdoc{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:18px 16px;font-size:13px;color:#23314d}
  .qd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .qd-brand{display:flex;gap:10px;align-items:flex-start;min-width:0}
  .qd-badge{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:0 0 auto}
  .qd-logo{max-height:50px;max-width:150px;object-fit:contain}
  .qd-co{font-size:18px;font-weight:800;color:var(--blue);line-height:1.1}
  .qd-tag{font-size:11px;color:var(--amber-dark);font-style:italic;margin-top:2px}
  .qd-reg{font-size:10px;color:var(--muted);margin-top:2px}
  .qd-meta{text-align:right;flex:0 0 auto}
  .qd-title{font-size:15px;font-weight:800;color:var(--blue);letter-spacing:1px}
  .qd-mrow{font-size:11px;color:var(--muted);margin-top:3px}
  .qd-mrow b{color:#23314d;margin-left:6px}
  .qd-rule{height:2px;background:var(--blue);margin:12px 0}
  .qd-fromto{display:flex;gap:16px;margin-bottom:14px}
  .qd-fromto > div{flex:1;min-width:0}
  .qd-lbl{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .qd-fromto b{font-size:13px;display:block;margin-bottom:2px}
  .qd-fromto div .ln{font-size:11px;color:#4a566e;line-height:1.45}
  .qd-table{width:100%;border-collapse:collapse;margin-bottom:10px}
  .qd-table th{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--blue);padding:6px 8px;text-align:left;font-weight:700}
  .qd-table th.r,.qd-table td.r{text-align:right}
  .qd-table th.c,.qd-table td.c{text-align:center}
  .qd-area td{background:#eef2f8;font-weight:800;color:var(--blue);font-size:12px;padding:6px 8px;border-top:1px solid var(--line)}
  .qd-table td{padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}
  .qd-table td .sub{font-size:10.5px;color:var(--muted);font-style:italic}
  .qd-table td.qd-desc{font-style:italic;color:#4a566e;background:#fafbfd;padding:4px 8px 8px;white-space:pre-wrap;border-bottom:1px solid var(--line)}
  .qd-totwrap{display:block}
  .qd-tot{width:100%}
  .qd-tr{display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;color:#4a566e}
  .qd-tr.grand{background:var(--blue);color:#fff;font-weight:800;font-size:15px;border-radius:8px;padding:9px 10px;margin-top:5px}
  .qd-foot{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .qd-foot .bank{white-space:pre-line;color:#4a566e}
</style>
</head>
<body>
<div id="app"></div>

/* Tidy a raw voice/typed scope-of-work description into a professional bulleted list. Heuristic — the AI step will do this beautifully later. */
function tidyScopeText(raw){
  if(!raw || !raw.trim()) return [];
  let s=raw.trim().replace(/\s+/g," ").replace(/^[\.,;:\s]+|[\.,;:\s]+$/g,"");
  // Normalise common product/term casing
  const fixes=[
    [/\bcenturion\b/gi,"Centurion"], [/\bevo\b/gi,"Evo"], [/\bsmart\b/gi,"Smart"],
    [/\bdc\b/gi,"DC"], [/\bac\b/gi,"AC"], [/\bled\b/gi,"LED"], [/\bpvc\b/gi,"PVC"], [/\bvat\b/gi,"VAT"],
    [/\bd\s*5\b/gi,"D5"], [/\bd\s*10\s*smart\b/gi,"D10 Smart"], [/\bd\s*10\b/gi,"D10"], [/\bd\s*20\b/gi,"D20"],
    [/\brazz?\s*rack\b/gi,"Razz rack"], [/\brazrack\b/gi,"Razz rack"],
    [/\binstall\s+it\s+(a\s+)?new\b/gi, (m,a)=>"install "+(a?"a ":"")+"new"], // drop the dangling "it"
    [/\bit's\s+(a\s+)?new\b/gi,(m,a)=>"a "+(a?"":"")+"new"]
  ];
  fixes.forEach(f=>{ s=s.replace(f[0],f[1]); });
  // Action verbs that typically start a new task
  const verbs=["replace","remove","install","fit","add","wire","connect","commission","test","supply","mount",
    "check","inspect","repair","service","paint","fix","rewire","clean","route","run","apply","seal","patch",
    "configure","program","reset","calibrate","verify","isolate","earth","attach","hang","pull","feed","splice","cut","measure","clear"];
  const verbRe=new RegExp("\\b(" + verbs.join("|") + ")\\b","gi");
  const positions=[]; let m;
  while((m=verbRe.exec(s))!==null) positions.push(m.index);
  let segs=[];
  if(!positions.length){
    segs=[s];
  } else {
    if(positions[0]>0){ const pre=s.slice(0,positions[0]).trim(); if(pre) segs.push(pre); }
    for(let i=0;i<positions.length;i++){
      const start=positions[i], end=(i+1<positions.length)?positions[i+1]:s.length;
      let seg=s.slice(start,end).trim()
        .replace(/\s+(and|then|also|plus|after that|next)\s*$/i,"")
        .replace(/[,;]\s*$/, "")
        .trim();
      if(seg) segs.push(seg);
    }
  }
  // Combine very short trailing verbs (e.g. "Test.") with the previous bullet ("…and test.")
  const out=[];
  segs.forEach(seg=>{
    const w=seg.split(/\s+/).filter(Boolean);
    if(w.length<=2 && out.length){
      out[out.length-1]=out[out.length-1].replace(/[.!?]\s*$/,"") + " and " + seg.toLowerCase();
    } else {
      out.push(seg);
    }
  });
  // Capitalise & end with a period
  return out.map(seg=>{
    let s2=seg.replace(/\s+/g," ").trim();
    s2=s2.charAt(0).toUpperCase()+s2.slice(1);
    if(!/[.!?]$/.test(s2)) s2+=".";
    return s2;
  });
}

    if(va>vb) return dir==="asc"?1:-1;
    return 0;
  });
  return arr;
}

/* ---------------- DEMO AI: text -> line items ---------------- */
const NUMWORDS = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
const NUMALT = Object.keys(NUMWORDS).join("|");

function wordOrDigit(tok){
  if(tok==null) return null;
  tok=String(tok).toLowerCase();
  if(/^\d+$/.test(tok)) return parseInt(tok,10);
  if(NUMWORDS[tok]!=null) return NUMWORDS[tok];
  return null;
}
function qtyBefore(text, phrase){
  const i=text.indexOf(phrase); if(i<0) return null;
  const pre=text.slice(Math.max(0,i-26), i).trim();
  const toks=pre.split(/[^a-z0-9]+/i).filter(Boolean);
  for(let k=toks.length-1;k>=Math.max(0,toks.length-3);k--){ const n=wordOrDigit(toks[k]); if(n!=null) return n; }
  return null;
}
function metresIn(text){
  const m=text.match(new RegExp("(\\d+|"+NUMALT+")\\s*(?:metres|meters|meter|metre|m\\b)"));
  return m?wordOrDigit(m[1]):null;
}
function firstNum(text){ const m=text.match(new RegExp("\\b(\\d+|"+NUMALT+")\\b")); return m?wordOrDigit(m[1]):null; }
function numAfterTo(text){ const m=text.match(new RegExp("\\bto\\b\\s+(\\d+|"+NUMALT+")")); return m?wordOrDigit(m[1]):null; }

function parseText(raw){
  const t=(" "+(raw||"").toLowerCase()+" ").replace(/\s+/g," ");
  const items=[]; const used=new Set();
  for(const c of data.catalogue){
    let hit=false, qty=1, phrase=null;
    for(const p of c.kw){ if(t.includes(p)){ hit=true; phrase=p; const q=qtyBefore(t,p); if(q!=null) qty=q; break; } }
    if(!hit) continue;
    if(c.cable){ const m=metresIn(t); qty = m!=null?m:(c.id==="c25"?15:5); }
    if(used.has(c.id)) continue; used.add(c.id);
    items.push({ catId:c.id, name:c.name, unit:c.unit, cost:c.cost, labourHrs:c.labourHrs, qty });
  }
  return items;
}

function buildQuote(job){
  normalize(job);
  const items=[];
  (job.sections||[]).forEach(sec=>{
    parseText(sec.text).forEach(it=>{ it.sectionId=sec.id; it.sectionTitle=sec.title; items.push(it); });
  });
  job.lineItems=items;
  job.status=items.length?"quoted":"draft";
  if(!job.number) job.number=nextNumber();
  save();
}

function matMkPct(job){ return job&&job.matMarkup!=null ? job.matMarkup : data.settings.materialMarkup; }
function labMkPct(job){ return job&&job.labMarkup!=null ? job.labMarkup : data.settings.labourMarkup; }
function totals(job){
  const s=data.settings;
  const mPct=matMkPct(job), lPct=labMkPct(job);
  // materials
  let matCost=0, estHours=0;
  (job.lineItems||[]).forEach(li=>{ matCost+=li.cost*li.qty; estHours+=li.labourHrs*li.qty; });
  const matMarkupAmt = matCost * (mPct/100);
  const matSell = matCost + matMarkupAmt;
  // labour: use team cost if assigned, else estimated hours × average staff rate
  const teamHours=(job.team||[]).reduce((a,t)=>a+(t.hours||0),0);
  const teamCost=(job.team||[]).reduce((a,t)=>{ const p=staffById(t.staffId); return a+(t.hours||0)*((p&&p.rate)||0); },0);
  const usingTeam = teamHours>0;
  const hours = usingTeam ? teamHours : estHours;
  const labCost = usingTeam ? teamCost : estHours*avgStaffRate();
  const labMarkupAmt = labCost * (lPct/100);
  const labSell = labCost + labMarkupAmt;
  // travel & totals
  const travel=travelCost(job);
  const sub=matSell+labSell+travel, vat=sub*(s.vat/100);
  return { matCost, matMarkupAmt, matSell, matMk:mPct,
    hours, labCost, labMarkupAmt, labSell, labMk:lPct, usingTeam,
    travel, sub, vat, total:sub+vat,
    // legacy alias
    labour: labSell };
}
function lineSell(li, job){ return li.cost*(1+ matMkPct(job)/100); }
function staffById(id){ return data.staff.find(p=>p.id===id); }
function avgStaffRate(){ const s=data.staff||[]; if(!s.length) return 0; const t=s.reduce((a,p)=>a+(p.rate||0),0); return t/s.length; }
function teamCardHTML(j){
  const assigned=(j.team&&j.team.length)?j.team.map(t=>{ const p=staffById(t.staffId); if(!p) return ""; const cost=(t.hours||0)*(p.rate||0);

  }).join("") : `<div class="empty small" style="padding:14px">No one assigned yet — pick from the dropdown below.</div>`;
  const unassigned=(data.staff||[]).filter(p=>!(j.team||[]).some(t=>t.staffId===p.id));
  let picker;
  if(unassigned.length){
    picker=`<select id="team-add-select" style="margin-top:10px"><option value="">＋ Add team member…</option>${unassigned.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — ${esc(p.role||"")} (${rands(p.rate)}/hr)</option>`).join("")}</select>`;
  } else if(data.staff && data.staff.length){
    picker=`<div class="hint" style="margin-top:8px">Everyone on staff is already on this job.</div>`;
  } else {
    picker=`<div class="hint" style="margin-top:8px">Add your team in <b>Settings → Staff</b> first.</div>`;
  }
  const teamTotal=(j.team&&j.team.length)?(()=>{const c=costToCompany(j);return `<div class="teamtotal"><span>Team total: ${c.hours} hr</span><span>${rands(c.labour)} cost</span></div>`;})():"";
  return `<div class="hint" style="margin-bottom:6px">Who's on this job, and how many hours each. You can add more than one person.</div>
    ${assigned}${picker}${teamTotal}`;
}
function bindTeam(j){
  document.querySelectorAll("[data-teamhrs]").forEach(inp=>inp.oninput=()=>{ const id=inp.dataset.teamhrs; const t=(j.team||[]).find(x=>x.staffId===id); if(t){ t.hours=Math.max(0,parseFloat(inp.value)||0); save(); render(); } });
  document.querySelectorAll("[data-teamdel]").forEach(b=>b.onclick=()=>{ j.team=(j.team||[]).filter(t=>t.staffId!==b.dataset.teamdel); save(); render(); });
  const sel=document.getElementById("team-add-select"); if(sel) sel.onchange=()=>{ const id=sel.value; if(!id) return; j.team=j.team||[]; if(!j.team.some(t=>t.staffId===id)){ j.team.push({staffId:id, hours:0}); save(); render(); } };
}
/* ---------------- MAP PIN-DROP (Leaflet + OSM) ---------------- */
const LEAFLET_CSS="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
const LEAFLET_JS ="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
let leafletPromise=null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletPromise) return leafletPromise;
  leafletPromise=new Promise((res,rej)=>{
    const link=document.createElement("link"); link.rel="stylesheet"; link.href=LEAFLET_CSS; document.head.appendChild(link);
    const sc=document.createElement("script"); sc.src=LEAFLET_JS; sc.onload=()=>res(); sc.onerror=()=>rej(new Error("Map library failed to load")); document.head.appendChild(sc);
  });
  return leafletPromise;
}
let mapPickerState=null;
async function openMapPicker(opts){
  try{ await ensureLeaflet(); }
  catch(e){ alert("Couldn't load the map. Check your internet and try again."); return; }
  let ov=document.getElementById("map-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="map-ov"; document.body.appendChild(ov); }
  ov.innerHTML=`<div class="map-card">
    <div class="map-head"><h3>${esc(opts.title||"Pick location on map")}</h3><button class="x" id="map-close">✕</button></div>
    <div class="map-body"><div id="leaflet-map"></div><button class="map-locate" id="map-locate">📍 My location</button></div>
    <div class="map-foot"><div class="map-coords" id="map-coords">Tap the map to place a pin, or drag the existing one.</div>
      <button class="btn ghost sm" id="map-cancel">Cancel</button>
      <button class="btn primary sm" id="map-confirm">✓ Use this</button></div>
  </div>`;
  ov.style.display="flex";
  let lat=opts.initialLat, lng=opts.initialLng;
  let centerSet = lat!=null && lng!=null;
  if(!centerSet){ lat=-33.9608; lng=25.6022; } // Gqeberha default
  const map=L.map("leaflet-map").setView([lat,lng], centerSet?16:13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors",maxZoom:19}).addTo(map);
  const marker=L.marker([lat,lng],{draggable:true}).addTo(map);
  const coordsEl=document.getElementById("map-coords");
  const updateCoords=()=>{ const p=marker.getLatLng(); coordsEl.textContent=`Lat ${p.lat.toFixed(5)}, Lng ${p.lng.toFixed(5)}`; };
  if(centerSet) updateCoords();
  marker.on("dragend", updateCoords);
  map.on("click",(e)=>{ marker.setLatLng(e.latlng); updateCoords(); });
  mapPickerState={ map, marker };

/* ---------------- DISTANCE (geocoding + driving km) ---------------- */
async function geocode(address){
  if(!address || !address.trim()) return null;
  const a=address.trim();
  const tries=[a];
  const noPc=a.replace(/,?\s*\d{4}\s*$/, "").trim(); // drop trailing postcode
  if(noPc && noPc!==a) tries.push(noPc);
  const noNum=noPc.replace(/^\d+\s+/, "").trim(); // drop leading street number
  if(noNum && !tries.includes(noNum)) tries.push(noNum);
  const parts=a.split(",").map(s=>s.trim()).filter(Boolean);
  if(parts.length>1){
    const suburb=parts.slice(-3).join(", ");
    if(!tries.includes(suburb)) tries.push(suburb);
  }
  for(let i=0;i<tries.length;i++){
    try{
      const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=za&q='+encodeURIComponent(tries[i]);
      const r=await fetch(url, {headers:{'Accept':'application/json'}});
      if(r.ok){
        const j=await r.json();
        if(j && j.length){ return {lat:parseFloat(j[0].lat), lng:parseFloat(j[0].lon), display:j[0].display_name}; }
      }
    }catch(e){}
    if(i<tries.length-1) await new Promise(rs=>setTimeout(rs,1100)); // Nominatim rate limit
  }
  return null;
}
async function reverseGeocode(lat, lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lng}`;
    const r=await fetch(url, {headers:{'Accept':'application/json'}});
    if(!r.ok) return null;
    const j=await r.json(); if(!j) return null;
    const a=j.address||{};
    const street=[a.house_number, a.road||a.pedestrian||a.path].filter(Boolean).join(" ");
    const suburb=a.suburb||a.neighbourhood||a.hamlet;
    const city=a.city||a.town||a.village||a.municipality;
    const parts=[];
    if(street) parts.push(street);
    if(suburb) parts.push(suburb);
    if(city && city!==suburb) parts.push(city);
    if(a.postcode) parts.push(a.postcode);
    return parts.length ? parts.join(", ") : (j.display_name||null);
  }catch(e){ return null; }
}
async function routeKm(from, to){
  if(!from || !to) return null;
  try{
    const url=`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${to.lng},${to.lat}?overview=false`;
    const r=await fetch(url);
    if(!r.ok) return null;
    const j=await r.json();
    if(j.routes && j.routes[0]) return Math.round(j.routes[0].distance/100)/10; // 1 dp km
  }catch(e){}
  return null;
}
async function ensureDistance(job){
  const s=data.settings;
  // Geocode business address if needed
  if(s.businessLat==null || s.businessLng==null){
    if(!s.address) return {error:"Business address not set in Settings."};
    const g=await geocode(s.address);
    if(g){ s.businessLat=g.lat; s.businessLng=g.lng; s.businessLocatedAs=g.display; save(); }
    else return {error:"Couldn't locate the business address."};
  }
  // Geocode job site address
  if(!job.lat || !job.lng || job._geocodedAddr !== job.address){
    if(!job.address) return {error:"Site address is empty on this job."};
    const g=await geocode(job.address);
    if(g){ job.lat=g.lat; job.lng=g.lng; job.locatedAs=g.display; job._geocodedAddr=job.address; save(); }
    else return {error:"Couldn't locate the site address."};
  }
  // Driving distance
  const km=await routeKm({lat:s.businessLat,lng:s.businessLng}, {lat:job.lat,lng:job.lng});
  if(km!=null){ job.distanceKm=km; save(); return {km}; }
  return {error:"Couldn't calculate the driving distance."};
}
function travelCost(job){
  const s=data.settings;
  if(job.travel!=null) return job.travel; // manual override
  if(job.distanceKm!=null) return job.distanceKm * 2 * (s.travelRate||0);
  return 0;
}

function costToCompany(job){
  const s=data.settings;
  const mat=(job.lineItems||[]).reduce((a,li)=>a+li.cost*li.qty, 0);
  const estHours=(job.lineItems||[]).reduce((a,li)=>a+li.labourHrs*li.qty, 0);
  let teamHours=0, teamLabour=0;
  (job.team||[]).forEach(t=>{ const p=staffById(t.staffId); if(p){ teamHours+=(t.hours||0); teamLabour+=(t.hours||0)*(p.rate||0); } });
  const usingTeam = teamHours>0;
  const hours = usingTeam ? teamHours : estHours;
  const labour = usingTeam ? teamLabour : estHours*avgStaffRate();
  const travel=travelCost(job);
  return { mat, hours, labour, travel, total: mat+labour+travel, usingTeam };
}

const ALIAS={cable:"c25", wire:"c25", breaker:"cb20", board:"db18", plug:"dbl", socket:"dbl"};
function findItem(text){

}

// Apply a spoken edit command to the quote. Returns a human summary.
function applyEdit(job, text){
  const low=text.toLowerCase();
  if(/travel/.test(low)){ const n=numAfterTo(low)||firstNum(low); if(n!=null){ job.travel=n; save(); return "Set travel to "+rands(n); } }
  const cat=findItem(low);
  const sec=detectSection(job, low);
  if(/\b(remove|delete|take out|get rid|scrap|cancel)\b/.test(low)){
    if(!cat) return "Didn't catch which item to remove.";
    const before=job.lineItems.length;
    job.lineItems=job.lineItems.filter(li=>li.catId!==cat.id);
    save(); return before>job.lineItems.length ? ("Removed "+cat.name) : (cat.name+" wasn't on the quote.");
  }
  if(/\b(change|set|make|update)\b/.test(low) && /\bto\b/.test(low)){
    if(!cat) return "Didn't catch which item to change.";
    const n=numAfterTo(low); if(n==null) return "Didn't catch the new amount.";
    const hits=job.lineItems.filter(li=>li.catId===cat.id);
    if(hits.length){ hits.forEach(li=>li.qty=n); save(); return "Set "+cat.name+" to "+n; }
    // not present -> add it
    addLine(job, cat, n, sec); save(); return "Added "+n+" × "+cat.name;
  }
  // default = add
  if(cat){ const n = (cat.cable? (metresIn(low)||firstNum(low)||5) : (firstNum(low)||1)); addLine(job, cat, n, sec); save(); return "Added "+n+" × "+cat.name; }
  return "Sorry, didn't catch that. Try “add two plug points”.";
}
function addLine(job, cat, qty, sec){
  const target = sec || (job.sections&&job.sections[0]);
  const tid = target?target.id:"adj";
  const existing = job.lineItems.find(li=>li.catId===cat.id && li.sectionId===tid);
  if(existing){ existing.qty += (qty||1); return; }
  job.lineItems.push({ catId:cat.id, name:cat.name, unit:cat.unit, cost:cat.cost, labourHrs:cat.labourHrs, qty:qty||1,
    sectionId: tid, sectionTitle: target?target.title:"Adjustments" });
}

/* ---------------- PDF TEXT EXTRACTION (pdf.js) ---------------- */
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let pdfjsPromise=null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsPromise) return pdfjsPromise;
  pdfjsPromise=new Promise((res,rej)=>{
    const sc=document.createElement("script"); sc.src=PDFJS_URL;
    sc.onload=()=>{ if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; res(); } else rej(new Error("pdf.js loaded incorrectly")); };
    sc.onerror=()=>rej(new Error("PDF reader failed to load"));
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}
async function extractPdfText(file){
  await ensurePdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const allLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    // Bucket text items by Y position to reconstruct visual rows
    const buckets=[];
    tc.items.forEach(it=>{
      if(!it.str||!it.str.trim()) return;
      const y=Math.round(it.transform[5]);
      let b=buckets.find(bb=>Math.abs(bb.y-y)<=2);
      if(!b){ b={y,items:[]}; buckets.push(b); }
      b.items.push({x:it.transform[4], str:it.str});
    });
    buckets.sort((a,b)=>b.y-a.y); // top to bottom
    buckets.forEach(b=>{
      b.items.sort((a,b)=>a.x-b.x);
      const line=b.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
      if(line) allLines.push(line);
    });
  }
  return allLines.join("\n");
}

  }
  let endIdx=allLines.length;
  if(startIdx>=0){
    for(let i=startIdx+1;i<allLines.length;i++){
      // match these footer/totals indicators anywhere in the line — PDF extraction often glues footer text together
      if(/\b(sub\s*-?\s*total|grand\s*total|total\s+(amount|excl|incl|due|paid|invoice|goods|vat|weight|owing|exclusive|inclusive)|invoice\s+total|terms\s+(and|of)|conditions\s+(are|of)|bank\s+details|acc(ount)?\s+no|branch|payment\s+(terms|details|method|due)|days?\s+from\s+invoice|kindly\s+(note|see|find)|thank\s+you|kind\s+regards|yours\s+(faithfully|sincerely)|delivery\s+(date|note|address|details)|notes?:|signed|signature|deposit\s+(required|paid)|vat\s*@|vat\s*[\d.]+\s*%|balance\s+(due|owing)|please\s+(note|find))\b/i.test(allLines[i])){
        endIdx=i; break;
      }
    }
  }
  const lines = (startIdx>=0) ? allLines.slice(startIdx+1, endIdx) : allLines;
  lines.forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    // skip table headers and common invoice metadata (extra safety, in case any made it through)
    if(/^(item|description|product|name|qty|code|prod\s*code|weight|disc|unit\s*price|total|amount)\b/i.test(line)) return;
    if(/^(quotation|invoice|date|due\s*date|tel|phone|fax|vat\s*(no|number)|account|customer|reference|page|terms|address|p\.?\s*o\.?\s*box|email|sub[\s-]?total|grand\s*total|sales\s*rep|overall\s*discount|bank|acc(ount)?\s*no|branch|cell|attn|attention|notes?:|comments?:|delivery|signed|signature)\b/i.test(line)) return;
    // capture each numeric token with its position so we can slice the name precisely
    const re=/\d+(?:[ ,]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g;
    const positions=[]; let m;
    while((m=re.exec(line))!==null){ positions.push({tok:m[0], start:m.index}); }
    if(!positions.length) return;
    // skip lines whose only number looks like a long ID (e.g. quote number 00410859)
    if(positions.length===1 && !/[.,]\d/.test(positions[0].tok) && positions[0].tok.replace(/\s/g,"").length>5) return;
    // when there are 4+ numbers, the typical supplier-quote columns end with "... unit_price total". Pick 2nd-last as unit price when total ≈ qty × unit.
    let pIdx=positions.length-1;
    if(positions.length>=4){
      const last=toNum(positions[positions.length-1].tok);
      const sLast=toNum(positions[positions.length-2].tok);
      if(sLast>0 && last>=sLast){
        const ratio=last/sLast;
        if(ratio>=1 && ratio<=100 && Math.abs(ratio-Math.round(ratio))<0.05) pIdx=positions.length-2;
      }
    }
    const price=toNum(positions[pIdx].tok); if(!price || price>1e6) return;
    // name = everything before this number token; then trim trailing qty/weight/disc-like numbers
    let name=line.slice(0,positions[pIdx].start)
      .replace(/[Rr]\s*$/,"")
      .replace(/[\s,;:|\t\-]+$/,"")
      .replace(/\s{2,}/g," ")
      .trim()
      .replace(/(\s+\d+(?:[.,]\d{1,2})?)+\s*$/, "")
      .trim();
    // name must include a real alphabetic word (skip wrapped detail lines like "800kg" or "2.4m")
    if(!name || name.length<3 || !/[a-z]{3,}/i.test(name)) return;
    const unit=/per\s*m\b|\/m\b|per\s*met/i.test(line)?"m":"ea";
    out.push({name, price, unit});
  });
  return out;
}
function matchCatItem(name){
  const t=" "+name.toLowerCase()+" ";
  for(const c of data.catalogue){ for(const p of (c.kw||[])){ if(t.includes(p)) return c; } }
  for(const c of data.catalogue){ const w=c.name.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>3); if(w.length && w.every(x=>t.includes(x))) return c; }
  for(const c of data.catalogue){ const w=c.name.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>4); if(w.some(x=>t.includes(x))) return c; }
  return null;
}
function buildProposals(parsed){
  return parsed.map(p=>{
    const m=matchCatItem(p.name);
    let status="new", oldCost=null;
    if(m){ oldCost=m.cost; status=Math.abs(m.cost-p.price)<0.005?"same":"change"; }
    return { name:p.name, price:p.price, unit:p.unit||"ea", matchId:m?m.id:null, matchName:m?m.name:null, oldCost, status, approved: status!=="same", supplier: p.supplier||"" };
  });
}
function applyProposals(){
  let updated=0, added=0;
  (state.proposals||[]).forEach(p=>{
    if(!p.approved || p.status==="same") return;
    const sup = p.supplier || state.supplierName || "";
    if(p.matchId){ const c=data.catalogue.find(x=>x.id===p.matchId); if(c){ c.cost=p.price; c.updated=Date.now(); if(sup) c.supplier=sup; updated++; } }
    else { data.catalogue.push({ id:"sup"+uid(), name:p.name, unit:p.unit||"ea", cost:p.price, labourHrs:0.5, kw:[p.name.toLowerCase()], supplier:sup, updated:Date.now() }); added++; }
  });
  save(); state.proposals=null;
  flash("Updated "+updated+" price"+(updated===1?"":"s")+" · added "+added+" new item"+(added===1?"":"s"));
  state.settingsTab="prices"; render();
}

/* ---------------- VOICE ENGINE ---------------- */
let recog=null, listenState=null;
function voiceSupported(){ return ("webkitSpeechRecognition" in window)||("SpeechRecognition" in window); }
function startListen(opts){
  if(!voiceSupported()){ alert("Voice isn't supported in this browser — please type instead. (Works on a phone over the live link.)"); return; }
  if(recog) stopListen();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR(); recog.lang=(data.settings.spokenLang||"en-ZA"); recog.continuous=true; recog.interimResults=true;
  let finalText="";
  listenState={opts, active:true, getFinal:()=>finalText};
  recog.onresult=(e)=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) finalText+=r[0].transcript+" "; else interim+=r[0].transcript; }
    const live=(finalText+interim).replace(/\s+/g," ").trim();
    if(opts.onLive) opts.onLive(live);
    const el=document.getElementById("ov-live"); if(el) el.textContent=live||"Listening…";
  };
  recog.onend=()=>{ if(listenState&&listenState.active){ try{recog.start();}catch(e){} } };
  recog.onerror=()=>{};
  try{recog.start();}catch(e){}
  showOverlay(opts.title||"Listening…", opts.sub||"Speak naturally, then tap Done");
}
function stopListen(){
  if(!recog){ hideOverlay(); return; }
  const f=listenState?listenState.getFinal().trim():""; const opts=listenState?listenState.opts:{};
  if(listenState) listenState.active=false;
  try{recog.stop();}catch(e){} recog=null; listenState=null;
  hideOverlay();
  if(opts.onFinal) opts.onFinal(f);
}
function showOverlay(title, sub){
  let ov=document.getElementById("voice-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="voice-ov"; document.body.appendChild(ov); }
  ov.innerHTML=`<div class="ov-card"><div class="ov-mic">🎤</div>
    <div class="ov-title">${esc(title)}</div><div class="ov-sub">${esc(sub||"")}</div>
    <div class="ov-live" id="ov-live">Listening…</div>
    <button class="btn green" id="ov-stop">✓ Done</button></div>`;
  ov.style.display="flex";
  document.getElementById("ov-stop").onclick=stopListen;
}
function hideOverlay(){ const ov=document.getElementById("voice-ov"); if(ov) ov.style.display="none"; }

function dictateInto(id, after){
  const el=document.getElementById(id); if(!el) return;

function jobMatches(j,q){
  if(!q) return true; q=q.toLowerCase();
  return [numberFor(j), j.client, j.address, dateStr(j.created), j.phone].some(x=>x&&String(x).toLowerCase().includes(q));
}
function sortedJobs(){
  const tot=j=>(j.lineItems&&j.lineItems.length)?totals(j).total:0;
  let arr=data.jobs.filter(j=>jobMatches(j,state.search));
  const by=state.sort;
  if(by==="old") arr.sort((a,b)=>a.created-b.created);
  else if(by==="number") arr.sort((a,b)=>(b.number||0)-(a.number||0));
  else if(by==="client") arr.sort((a,b)=>(a.client||"~").localeCompare(b.client||"~"));
  else if(by==="high") arr.sort((a,b)=>tot(b)-tot(a));
  else if(by==="low") arr.sort((a,b)=>tot(a)-tot(b));
  else arr.sort((a,b)=>b.created-a.created); // new
  return arr;
}

/* ---------------- EVENTS ---------------- */
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function num(id){ const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; }
function flash(msg){
  const d=document.createElement("div"); d.textContent=msg;
  d.style.cssText="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1c2433;color:#fff;padding:11px 20px;border-radius:30px;z-index:99;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90%;text-align:center";
  document.body.appendChild(d); setTimeout(()=>d.remove(),1900);
}

function topbarVoice(){
  const j=currentJob();
  if(state.view==="new"){ const id=(lastFocusId&&document.getElementById(lastFocusId))?lastFocusId:"f-client"; flash("Filling: "+(({"f-client":"client name","f-address":"address","f-email":"email","f-phone":"mobile"})[id]||"field")); dictateInto(id); return; }
  if(state.view==="capture"){
    let sec=(j.sections||[]).find(x=>x.id===state.activeSec) || (j.sections&&j.sections[j.sections.length-1]);
    if(!sec){ sec={id:uid(),title:"General",text:""}; j.sections=j.sections||[]; j.sections.push(sec); save(); }
    state.activeSec=sec.id;
    const base=sec.text?sec.text.trim()+" ":"";
    startListen({ title:"Listening — "+(sec.title||"area"), sub:"Describe the work, then tap Done",
      onLive:(t)=>{ const el=document.querySelector('[data-sectext="'+sec.id+'"]'); if(el) el.value=base+t; },
      onFinal:(t)=>{ sec.text=(base+t).trim(); save(); render(); } });
    return;
  }
  if(state.view==="quote"){
    startListen({ title:"Listening…", sub:"e.g. “add two plugs” or “send by WhatsApp”",
      onFinal:(t)=>{ if(!t){return;} if(isSendCmd(t)){ const ch=sendChannel(t)||"whatsapp"; sendQuote(j,ch,!!(j.photos&&j.photos.length)); return; } const r=applyEdit(j,t); buildKeepExtras(j); flash(r); render(); } });
    return;
  }
  if(state.view==="jobs"){ startListen({ title:"Say a command", sub:"e.g. “new job”", onFinal:(t)=>{ if(/new job|new quote|add job/i.test(t)) go("new"); else flash("Try saying “new job”."); } }); return; }
  if(state.view==="settings"){ const id=(lastFocusId&&document.getElementById(lastFocusId))?lastFocusId:"s-company"; dictateInto(id); return; }
  if(state.view==="sent"){ startListen({ title:"Say a command", sub:"e.g. “back to jobs”", onFinal:(t)=>{ if(/job|done|back|home/i.test(t)) go("jobs"); } }); }
}
// recompute totals/status after a voice edit without wiping voice-added extras
function buildKeepExtras(job){ job.status=job.lineItems.length?"quoted":"draft"; save(); }

function bind(){
  document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{ stopListen(); go(el.dataset.go); });
  document.querySelectorAll("[data-job]").forEach(el=>el.onclick=()=>{ const j=data.jobs.find(x=>x.id===el.dataset.job); normalize(j); go(j.lineItems&&j.lineItems.length?"quote":"capture", el.dataset.job); });
  const tv=document.querySelector("[data-voice]"); if(tv) tv.onclick=topbarVoice;

  if(state.view==="jobs"){
    const sb=document.getElementById("job-search"); if(sb) sb.oninput=()=>{ state.search=sb.value; refreshJobList(); };
    const so=document.getElementById("job-sort"); if(so) so.onchange=()=>{ state.sort=so.value; refreshJobList(); };
    const sm=document.querySelector('[data-fieldmic="job-search"]'); if(sm) sm.onclick=()=>dictateInto("job-search",(v)=>{ state.search=v; refreshJobList(); });
  }

  if(state.view==="new"){
    document.querySelectorAll("[data-fieldmic]").forEach(b=>b.onclick=()=>dictateInto(b.dataset.fieldmic));
    document.getElementById("f-save").onclick=()=>{
      const job={ id:uid(), number:nextNumber(), created:Date.now(), status:"draft", client:val("f-client"), address:val("f-address"),
        email:val("f-email"), phone:val("f-phone"), lang:(document.getElementById("f-lang")||{}).value||"en", sections:[], photos:[], lineItems:null, travel:null };
      data.jobs.push(job); save(); state.activeSec=null; go("capture", job.id);
    };
  }

  if(state.view==="capture"){
    const j=currentJob();
    const cmap={"c-client":"client","c-address":"address","c-email":"email","c-phone":"phone"};
    Object.keys(cmap).forEach(id=>{ const el=document.getElementById(id); if(el) el.oninput=()=>{ j[cmap[id]]=el.value; if(id==="c-address" && !((j.locatedAs||"").startsWith("Pinned"))){ delete j.lat; delete j.lng; delete j.distanceKm; delete j._geocodedAddr; delete j._distanceTried; } save(); if(id==="c-client"){ const h=document.querySelector(".topbar h1"); if(h) h.textContent=el.value||"Capture"; } }; });
    document.querySelectorAll("[data-fieldmic]").forEach(b=>{ const id=b.dataset.fieldmic; if(cmap[id]) b.onclick=()=>dictateInto(id,(v)=>{ j[cmap[id]]=v.trim(); save(); }); });
    const cl=document.getElementById("c-lang"); if(cl) cl.onchange=()=>{ j.lang=cl.value; save(); };
    const cp=document.getElementById("c-pinsite"); if(cp) cp.onclick=()=>openMapPicker({
      title:"Pin the job site",
      initialLat:j.lat, initialLng:j.lng,
      onPick:async (p)=>{
        j.lat=p.lat; j.lng=p.lng;
        j.locatedAs=`Pinned on map (${p.lat.toFixed(5)}, ${p.lng.toFixed(5)})`;
        delete j.travel; save(); flash("Site pinned · looking up address…");
        const addr=await reverseGeocode(p.lat, p.lng);
        if(addr){ j.address=addr; }
        j._geocodedAddr=j.address; save();
        const s2=data.settings;
        if(s2.businessLat!=null){
          const km=await routeKm({lat:s2.businessLat,lng:s2.businessLng},{lat:p.lat,lng:p.lng});
          if(km!=null){ j.distanceKm=km; save(); flash(`Distance: ${km} km`+(addr?" · address updated":"")); }
          else flash(addr?"Address updated":"Site pinned");
        } else { flash(addr?"Address updated":"Site pinned"); }
        render();
      }
    });
    document.querySelectorAll("[data-sectext]").forEach(ta=>{
      ta.onfocus=()=>{ state.activeSec=ta.dataset.sectext; };
      ta.oninput=()=>{ const sec=j.sections.find(s=>s.id===ta.dataset.sectext); if(sec){ sec.text=ta.value; save(); } };
    });
    document.querySelectorAll("[data-sectitle]").forEach(inp=>inp.oninput=()=>{ const sec=j.sections.find(s=>s.id===inp.dataset.sectitle); if(sec){ sec.title=inp.value; save(); } });
    document.querySelectorAll("[data-secmic]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.secmic; const sec=j.sections.find(s=>s.id===id); if(!sec) return; state.activeSec=id;
      const base=sec.text?sec.text.trim()+" ":"";
      startListen({ title:"Listening — "+(sec.title||"area"), sub:"Describe the work, then tap Done",
        onLive:(t)=>{ const el=document.querySelector('[data-sectext="'+id+'"]'); if(el) el.value=base+t; },
        onFinal:(t)=>{ sec.text=(base+t).trim(); save(); render(); } });
    });
    document.querySelectorAll("[data-secdel]").forEach(b=>b.onclick=()=>{ j.sections=j.sections.filter(s=>s.id!==b.dataset.secdel); save(); render(); });
    const addAreaBtn=document.getElementById("add-area"); if(addAreaBtn) addAreaBtn.onclick=()=>{
      j.sections=j.sections||[]; const sec={id:uid(),title:"",text:""}; j.sections.push(sec); state.activeSec=sec.id; save(); render();
      setTimeout(()=>{ const inp=document.querySelector('[data-sectitle="'+sec.id+'"]'); if(inp){ inp.focus(); inp.placeholder="Name this area (e.g. Outside)"; } }, 40);
    };
    document.getElementById("demo-fill").onclick=()=>{ j.sections=DEMO_SECTIONS.map(s=>({id:uid(),title:s.title,text:s.text})); save(); render(); };
    bindTeam(j);
    const ph=document.getElementById("f-photo");
    if(ph) ph.onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ j.photos=j.photos||[]; j.photos.push(r.result); save(); render(); }; r.readAsDataURL(f); };
    document.getElementById("to-quote").onclick=()=>{ stopListen(); buildQuote(j); go("quote", j.id); };
  }

  if(state.view==="quote"){
    const j=currentJob();
    document.querySelectorAll("[data-qty]").forEach(inp=>inp.onchange=()=>{ j.lineItems[+inp.dataset.qty].qty=Math.max(0,parseFloat(inp.value)||0); save(); render(); });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ j.lineItems.splice(+b.dataset.del,1); save(); render(); });
    document.querySelectorAll("[data-qsecmic]").forEach(b=>b.onclick=()=>{
      const secId=b.dataset.qsecmic; const sec=(j.sections||[]).find(s=>s.id===secId)||null;
      startListen({ title:"Change "+((sec&&sec.title)||"this area"), sub:"e.g. “add two plug points”",
        onFinal:(t)=>{ if(!t) return; const r=applyEdit(j, (sec?sec.title+" ":"")+t); buildKeepExtras(j); flash(r); render(); } });
    });
    document.querySelectorAll("[data-qsecadd]").forEach(b=>b.onclick=()=>openAdd(b.dataset.qsecadd));
    const ai=document.getElementById("add-item"); if(ai) ai.onclick=()=>openAdd();
    const ve=document.getElementById("voice-edit"); if(ve) ve.onclick=()=>topbarVoice();
    const et=document.getElementById("edit-travel"); if(et) et.onclick=()=>{ const cur=j.travel!=null?j.travel:travelCost(j); const v=prompt("Travel fee (R) — leave blank for distance-based:", cur); if(v===null) return; if(v===""){ delete j.travel; save(); render(); return; } j.travel=parseFloat(v)||0; save(); render(); };
    const tc=document.getElementById("travel-calc"); if(tc) tc.onclick=()=>{ delete j.travel; delete j.lat; delete j.lng; delete j._geocodedAddr; delete j.locatedAs; flash("Recalculating distance…"); ensureDistance(j).then(r=>{ if(r.km!=null){ flash(`Distance set: ${r.km} km`); } else { flash(r.error||"Couldn't calculate distance."); } render(); }); };
    const ek=document.getElementById("edit-km"); if(ek) ek.onclick=()=>{ const v=prompt("Distance in km (one way) — this overrides the auto-calculation. Travel will be km × rate × 2.", j.distanceKm); if(v===null) return; const n=parseFloat(v); if(isNaN(n)||n<0){ flash("Enter a valid number of km."); return; } j.distanceKm=n; delete j.travel; save(); flash("Distance set to "+n+" km"); render(); };
    const tp=document.getElementById("travel-pin"); if(tp) tp.onclick=()=>openMapPicker({
      title:"Pin the job site",
      initialLat:j.lat, initialLng:j.lng,
      onPick:async (p)=>{
        j.lat=p.lat; j.lng=p.lng;
        j.locatedAs=`Pinned on map (${p.lat.toFixed(5)}, ${p.lng.toFixed(5)})`;
        delete j.travel; save(); flash("Site pinned · looking up address…");
        const addr=await reverseGeocode(p.lat, p.lng);
        if(addr){ j.address=addr; }
        j._geocodedAddr=j.address; save();
        const s2=data.settings;
        if(s2.businessLat==null){ flash("Now pin your business location in Settings."); render(); return; }
        const km=await routeKm({lat:s2.businessLat,lng:s2.businessLng},{lat:p.lat,lng:p.lng});
        if(km!=null){ j.distanceKm=km; save(); flash(`Distance: ${km} km`+(addr?" · address updated":"")); }
        else { flash(addr?"Address updated":"Couldn't calculate driving distance."); }
        render();
      }
    });
    const ta=document.getElementById("travel-auto"); if(ta) ta.onclick=()=>{ delete j.travel; save(); render(); if(j.distanceKm==null) document.getElementById("travel-calc")?.click(); };
    // auto-trigger distance calc on first quote view if business address is set and distance not yet known
    if(j.address && data.settings.address && j.distanceKm==null && j.travel==null && !j._distanceTried){ j._distanceTried=true; ensureDistance(j).then(r=>{ if(r.km!=null){ render(); } }); }
    const mm=document.getElementById("mk-mat"); if(mm) mm.onchange=()=>{ j.matMarkup=Math.max(0,parseFloat(mm.value)||0); save(); render(); };
    const lm=document.getElementById("mk-lab"); if(lm) lm.onchange=()=>{ j.labMarkup=Math.max(0,parseFloat(lm.value)||0); save(); render(); };
    bindTeam(j);
    ensureJsPDF().catch(()=>{}); // preload so the Share sheet opens within the tap
    const incPhotos=()=>{ const c=document.getElementById("inc-photos"); return c?c.checked:false; };
    document.getElementById("send-wa").onclick=()=>sendQuote(j,"whatsapp",incPhotos());
    document.getElementById("send-email").onclick=()=>sendQuote(j,"email",incPhotos());
  }

  if(state.view==="preview"){
    const j=currentJob(); if(!j) return;
    ensureJsPDF().catch(()=>{});
    const incPhotos=()=>{ const c=document.getElementById("inc-photos"); return c?c.checked:false; };
    const wa=document.getElementById("send-wa"); if(wa) wa.onclick=()=>sendQuote(j,"whatsapp",incPhotos());
    const em=document.getElementById("send-email"); if(em) em.onclick=()=>sendQuote(j,"email",incPhotos());
    const pp=document.getElementById("pv-pdf"); if(pp) pp.onclick=async ()=>{
      try{ await ensureJsPDF(); const blob=generatePdfBlob(j); const url=URL.createObjectURL(blob); window.open(url,"_blank"); setTimeout(()=>URL.revokeObjectURL(url), 60000); }
      catch(e){ flash("Couldn't open PDF: "+e.message); }
    };
  }

  if(state.view==="settings"){
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ state.settingsTab=b.dataset.tab; render(); });
    const ss=document.getElementById("s-save");
    if(ss) ss.onclick=()=>{ const s=data.settings; const prevAddr=s.address;
      s.company=val("s-company"); s.regName=val("s-regname"); s.address=val("s-address"); s.bank=val("s-bank"); s.tagline=val("s-tagline"); s.phone=val("s-phone"); s.email=val("s-email"); s.vatNo=val("s-vatno"); s.quotePrefix=val("s-prefix")||"Q";
      const sp=document.getElementById("s-spoken"); if(sp) s.spokenLang=sp.value;
      s.materialMarkup=num("s-markup"); s.labourMarkup=num("s-labourmk");
      const tr=document.getElementById("s-travelrate"); if(tr) s.travelRate=parseFloat(tr.value)||0;
      s.vat=num("s-vat"); save(); flash("Settings saved");
      // re-geocode business if address changed or never located
      const wasPinned=(s.businessLocatedAs||"").startsWith("Pinned");
      if(s.address && !wasPinned && (s.address!==prevAddr || s.businessLat==null)){ s.businessLat=null; s.businessLng=null; delete s.businessLocatedAs; save(); flash("Locating business…"); geocode(s.address).then(g=>{ if(g){ s.businessLat=g.lat; s.businessLng=g.lng; s.businessLocatedAs=g.display; save(); flash("Business located ✓"); render(); } else { flash("Couldn't locate that address — try pinning on the map."); } }); }
    };
    const pm=document.getElementById("s-pickmap");
    if(pm) pm.onclick=()=>openMapPicker({
      title:"Pin your business location",
      initialLat:data.settings.businessLat, initialLng:data.settings.businessLng,
      onPick:async (p)=>{
        data.settings.businessLat=p.lat; data.settings.businessLng=p.lng;
        data.settings.businessLocatedAs=`Pinned on map (${p.lat.toFixed(5)}, ${p.lng.toFixed(5)})`;
        save(); flash("Business pinned · looking up address…");
        const addr=await reverseGeocode(p.lat, p.lng);
        if(addr){ data.settings.address=addr; save(); flash("Business pinned · address updated"); }
        else { flash("Business pinned ✓"); }
        render();
      }
    });
    const lf=document.getElementById("s-logo");
    if(lf) lf.onchange=(e)=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ data.settings.logo=r.result; data.settings.logoRatio=img.width/img.height||3; save(); flash("Logo added"); render(); }; img.onerror=()=>{ data.settings.logo=r.result; data.settings.logoRatio=3; save(); render(); }; img.src=r.result; }; r.readAsDataURL(f); };
    const lc=document.getElementById("s-logo-clear"); if(lc) lc.onclick=()=>{ data.settings.logo=""; data.settings.logoRatio=0; save(); render(); };
    // ---- Price list table ----
    const psearch=document.getElementById("price-search");
    if(psearch){ psearch.oninput=()=>{ state.priceSearch=psearch.value; render(); const el=document.getElementById("price-search"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }; }
    document.querySelectorAll("[data-psort]").forEach(th=>th.onclick=()=>{ const k=th.dataset.psort; if(state.priceSort.key===k){ state.priceSort.dir=state.priceSort.dir==="asc"?"desc":"asc"; } else { state.priceSort={key:k,dir:"asc"}; } render(); });
    const chkAll=document.getElementById("pchk-all");
    if(chkAll){
      const visible=sortedFilteredCatalogue();
      const allChk=visible.length>0 && visible.every(c=>state.priceSelected.has(c.id));
      const someChk=visible.some(c=>state.priceSelected.has(c.id));
      chkAll.checked=allChk; chkAll.indeterminate=someChk && !allChk;
      chkAll.onchange=()=>{ if(chkAll.checked){ visible.forEach(c=>state.priceSelected.add(c.id)); } else { visible.forEach(c=>state.priceSelected.delete(c.id)); } render(); };
    }
    document.querySelectorAll("[data-pcheck]").forEach(cb=>cb.onchange=()=>{ if(cb.checked) state.priceSelected.add(cb.dataset.pcheck); else state.priceSelected.delete(cb.dataset.pcheck); render(); });
    document.querySelectorAll("[data-price]").forEach(inp=>{
      const c=data.catalogue.find(x=>x.id===inp.dataset.price); if(!c) return;
      inp.onfocus=()=>{ inp.value=String(c.cost); setTimeout(()=>inp.select(),0); };
      inp.onblur=()=>{ const v=parseCost(inp.value); c.cost=v; c.updated=Date.now(); save(); inp.value=formatCost(c.cost); };
    });
    document.querySelectorAll("[data-pricesupplier]").forEach(inp=>inp.oninput=()=>{ const c=data.catalogue.find(x=>x.id===inp.dataset.pricesupplier); if(c){ c.supplier=inp.value.trim(); save(); } });
    document.querySelectorAll("[data-bulk]").forEach(b=>b.onclick=()=>{
      const ids=Array.from(state.priceSelected); if(!ids.length) return;
      const a=b.dataset.bulk;
      if(a==="clear"){ state.priceSelected=new Set(); render(); return; }
      if(a==="delete"){ if(confirm(`Delete ${ids.length} item${ids.length>1?"s":""} from the price list?`)){ data.catalogue=data.catalogue.filter(c=>!state.priceSelected.has(c.id)); state.priceSelected=new Set(); save(); render(); flash(`${ids.length} item${ids.length>1?"s":""} deleted`); } return; }
      if(a==="supplier"){ const sup=prompt(`Set supplier for ${ids.length} selected item${ids.length>1?"s":""}:`, ""); if(sup===null) return; ids.forEach(id=>{ const c=data.catalogue.find(x=>x.id===id); if(c){ c.supplier=sup.trim(); c.updated=Date.now(); } }); save(); render(); flash(`Supplier set on ${ids.length} item${ids.length>1?"s":""}`); return; }
      if(a==="adjust"){ const v=prompt(`Adjust selected prices by % (e.g. 10 for +10%, -5 for -5%):`, ""); if(v===null) return; const p=parseFloat(v); if(isNaN(p)){ flash("Enter a valid percentage"); return; } ids.forEach(id=>{ const c=data.catalogue.find(x=>x.id===id); if(c){ c.cost=Math.round(c.cost*(1+p/100)*100)/100; c.updated=Date.now(); } }); save(); render(); flash(`Prices adjusted by ${p}% on ${ids.length} item${ids.length>1?"s":""}`); return; }
    });
    // ---- Staff tab ----
    const sa=document.getElementById("staff-add"); if(sa) sa.onclick=()=>{ data.staff=data.staff||[]; data.staff.push({id:"st"+uid(), name:"", role:"", rate:200}); save(); render(); };
    document.querySelectorAll("[data-staff-name]").forEach(inp=>inp.oninput=()=>{ const p=data.staff.find(x=>x.id===inp.dataset["staffName"]); if(p){ p.name=inp.value; save(); } });
    document.querySelectorAll("[data-staff-role]").forEach(inp=>inp.oninput=()=>{ const p=data.staff.find(x=>x.id===inp.dataset["staffRole"]); if(p){ p.role=inp.value; save(); } });
    document.querySelectorAll("[data-staff-rate]").forEach(inp=>inp.oninput=()=>{ const p=data.staff.find(x=>x.id===inp.dataset["staffRate"]); if(p){ p.rate=parseFloat(inp.value)||0; save(); } });
    document.querySelectorAll("[data-staff-del]").forEach(b=>b.onclick=()=>{ const id=b.dataset["staffDel"]; if(confirm("Remove this person from staff?")){ data.staff=data.staff.filter(p=>p.id!==id); data.jobs.forEach(j=>{ if(j.team) j.team=j.team.filter(t=>t.staffId!==id); }); save(); render(); } });

    // ---- Import tab ----
    const sn=document.getElementById("sup-name"); if(sn) sn.oninput=()=>{ state.supplierName=sn.value; };
    function showProposals(text){ const parsed=parsePriceLines(text); if(!parsed.length){ flash("Couldn't find any priced items in that."); return; } state.proposals=buildProposals(parsed); state.settingsTab="import"; render(); }
    const samp=document.getElementById("sup-sample"); if(samp) samp.onclick=()=>{ state.supplierName=state.supplierName||"ACME Wholesalers"; showProposals(SAMPLE_INVOICE); };
    // ensure at least 3 rows visible
    if(!state.entryRows || !state.entryRows.length){ state.entryRows=[{desc:"",supplier:"",price:""},{desc:"",supplier:"",price:""},{desc:"",supplier:"",price:""}]; }
    document.querySelectorAll("[data-eri]").forEach(inp=>inp.oninput=()=>{ const i=+inp.dataset.eri, f=inp.dataset.erfield; if(state.entryRows[i]) state.entryRows[i][f]=inp.value; });
    document.querySelectorAll("[data-erdel]").forEach(b=>b.onclick=()=>{ state.entryRows.splice(+b.dataset.erdel,1); if(!state.entryRows.length) state.entryRows=[{desc:"",supplier:"",price:""}]; render(); });
    const ar=document.getElementById("sup-addrow"); if(ar) ar.onclick=()=>{ state.entryRows.push({desc:"",supplier:"",price:""}); render(); };
    const rdt=document.getElementById("sup-readtbl"); if(rdt) rdt.onclick=()=>{
      const filled=(state.entryRows||[]).filter(r=>(r.desc||"").trim() && (r.price||"").toString().trim());
      if(!filled.length){ flash("Add at least one row with a description and a price."); return; }
      const parsed=filled.map(r=>({ name:r.desc.trim(), price:parseCost(r.price), unit:"ea", supplier:(r.supplier||"").trim() }));
      state.proposals=buildProposals(parsed); state.entryRows=[{desc:"",supplier:"",price:""},{desc:"",supplier:"",price:""},{desc:"",supplier:"",price:""}];
      state.settingsTab="import"; render();
    };
    const sf=document.getElementById("sup-file"); if(sf) sf.onchange=async (e)=>{
      const f=e.target.files[0]; if(!f) return;
      const isText=/\.(csv|txt)$/i.test(f.name) || /text|csv/.test(f.type);
      const isPdf=/\.pdf$/i.test(f.name) || f.type==="application/pdf";
      state.supplierName=state.supplierName||f.name.replace(/\.[^.]+$/,"");
      if(isText){ const r=new FileReader(); r.onload=()=>showProposals(r.result); r.readAsText(f); return; }
      if(isPdf){
        flash("Reading PDF…");
        try{
          const text=await extractPdfText(f);
          const parsed=parsePriceLines(text);
          if(!parsed.length){ flash("Couldn't find priced items in that PDF — try a CSV export instead."); return; }
          state.proposals=buildProposals(parsed); state.settingsTab="import"; render();
          flash("Found "+parsed.length+" items in the PDF");
        }catch(err){ flash("Couldn't read the PDF: "+err.message); }
        return;
      }
      flash("Reading photo invoices is the AI step — showing a sample for now.");
      showProposals(SAMPLE_INVOICE);
    };
    document.querySelectorAll("[data-prop]").forEach(cb=>cb.onchange=()=>{ const i=+cb.dataset.prop; if(state.proposals[i]) state.proposals[i].approved=cb.checked; });
    const pa=document.getElementById("prop-apply"); if(pa) pa.onclick=applyProposals;
    const pc=document.getElementById("prop-cancel"); if(pc) pc.onclick=()=>{ state.proposals=null; render(); };
  }
}

/* boot */
document.addEventListener("focusin",(e)=>{ if(e.target&&e.target.matches&&e.target.matches("input,textarea")) lastFocusId=e.target.id||null; });
render();
</script>
</body>
</html>
